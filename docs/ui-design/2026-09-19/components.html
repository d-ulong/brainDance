<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrainDance · 主题组件对照</title><link rel="stylesheet" href="theme.css"><style>
body{background:#efeee9;color:#26323b;padding:36px;font-family:"Segoe UI","Microsoft YaHei",sans-serif}.board{max-width:1280px;margin:auto}.board-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.board-head h1{font-size:27px}.board-head p{font-size:12px;color:#6a747b;margin:7px 0 0}.kicker{font-size:10px;letter-spacing:2px;color:#7c827e;margin-bottom:7px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:24px}.sample-theme{padding:27px;min-height:0;border-radius:20px}.sample-theme>h2{font-size:21px;letter-spacing:1px;margin:0}.theme-desc{font-size:11px;color:var(--muted);margin:3px 0 0}.sample-section{padding:23px 0;border-bottom:1px solid var(--line);min-height:134px}.sample-section:last-child{border:0;padding-bottom:0}.row-title{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--muted);margin:0 0 17px}.row-title span{font-size:9px;letter-spacing:1px;opacity:.7}.controls-sample{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.secondary{border:1px solid var(--line);background:var(--soft);padding:10px 16px;min-height:43px;border-radius:9px 4px;font-size:12px}.disabled{opacity:.36;cursor:not-allowed;filter:saturate(.2);box-shadow:none}.sample-task{padding:18px 20px;position:relative}.sample-task h3{font-size:18px;margin:9px 0 3px}.sample-task p{font-size:11px;color:var(--muted);margin:0}.sample-task>.task-check{position:absolute;right:22px;top:40px;font-size:28px;color:var(--accent)}.sample-nav{display:flex;padding:6px;border:1px solid var(--line);border-radius:13px;background:var(--bg);gap:4px}.sample-nav button{flex:1;background:transparent;border:0;color:var(--muted);font-size:11px;min-height:62px;border-radius:8px}.sample-nav button span{display:block;font-size:20px;margin-bottom:4px}.sample-nav button.active{background:var(--soft);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}.input-label{font-size:12px;display:block}.sample-input{font:inherit;font-size:13px;width:100%;background:var(--bg);color:var(--text);border:1px solid var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent);border-radius:8px;padding:12px 14px;margin-top:9px;outline:none}.input-hint{color:var(--muted);font-size:10px;margin:8px 0 0}.success-panel{padding:19px;display:flex;gap:15px;align-items:center;background:var(--soft);border-radius:12px;border:1px solid var(--line)}.success-panel>span{display:grid;place-items:center;width:44px;height:44px;flex-shrink:0;border:1px solid var(--success);border-radius:50%;color:var(--success);font-size:24px}.success-panel strong{font-size:14px}.success-panel p{font-size:10px;color:var(--muted);margin:3px 0 0}.success-panel>b{margin-left:auto;color:var(--warm);font-size:20px;font-weight:400}.board-footer{font-size:11px;color:#747a7a;margin-top:20px;display:flex;justify-content:space-between;gap:20px}[data-theme=candy] .secondary{border-radius:15px;background:#fffbf5;border-color:#e3c9bd;box-shadow:inset 0 2px 0 white,0 2px 0 #ead7ca}[data-theme=candy] .sample-task{border:1px solid #e8c6b4;background:#fff5e7;box-shadow:inset 0 0 0 4px #fffaf0,0 4px 0 #e4c7af66}[data-theme=candy] .sample-nav{border-radius:20px;background:#fffdf8;padding:7px;box-shadow:0 3px 0 #e6d2c466}[data-theme=candy] .sample-nav button{border-radius:14px}[data-theme=candy] .sample-nav button.active{background:linear-gradient(#fad6e2,#edb3cb);color:#883b59;box-shadow:inset 0 2px 0 #fff0f4,0 3px 0 #d397af}[data-theme=candy] .sample-input{border-radius:15px;background:#fffdf8;box-shadow:inset 0 2px 3px #ead6ce55,0 0 0 3px #d4789722}[data-theme=candy] .success-panel{background:#eef4e7;border-color:#d0dfc4;border-radius:20px}[data-theme=candy] .success-panel>span{border:2px dashed #8eb09a;background:#dfecdd;transform:rotate(-9deg)}@media(max-width:700px){body{padding:20px 12px}.columns{grid-template-columns:1fr}.board-head{display:block}.board-footer{display:block}.sample-theme{padding:23px}}</style></head><body><main class="board"><div class="board-head"><div><div class="kicker">BRAINDANCE / DESIGN SYSTEM / 03</div><h1>两套主题，一套操作逻辑</h1><p>从材质、形状到反馈建立风格，不只是替换配色。</p></div><span class="kicker">设计提案 · V1</span></div><div class="columns" id="columns"></div><div class="board-footer"><span>训练刺激区遵循训练规则定义的颜色、时序和交互。</span><span>默认 / 按下 / 不可用 · 焦点 · 完成反馈</span></div></main><script>
const rows=`<section class="sample-section"><h3 class="row-title"><span>01</span> 操作按钮</h3><div class="controls-sample"><button class="primary">查看日程 ↗</button><button class="primary pressed">按下状态</button><button class="secondary">查看详情</button><button class="primary disabled" disabled>保存</button></div></section><section class="sample-section"><h3 class="row-title"><span>02</span> 任务卡片</h3><article class="sample-task panel"><span class="tag">下一项任务</span><h3>阅读二十分钟</h3><p>17:00 – 17:20 · 待完成</p><span class="task-check">✦</span></article></section><section class="sample-section"><h3 class="row-title"><span>03</span> 手机导航</h3><nav class="sample-nav" aria-label="导航样式示例"><button class="active"><span>⌂</span>今天</button><button><span>◎</span>训练</button><button><span>▤</span>家庭消息</button><button><span>▦</span>计划日程</button><button><span>♙</span>我的</button></nav></section><section class="sample-section"><h3 class="row-title"><span>04</span> 表单与焦点</h3><label class="input-label">计划名称<input class="sample-input" value="放学后的安排" aria-label="计划名称示例"></label><p class="input-hint">明确的边界与焦点提示，保持阅读清楚。</p></section><section class="sample-section"><h3 class="row-title"><span>05</span> 完成反馈</h3><div class="success-panel"><span>✓</span><div><strong>今日任务已完成</strong><p>今天的努力，已经记录下来。</p></div><b>✦</b></div></section>`;
for(const [theme,title,desc] of [['space','深空探索站','舱体面板 · 冷光边缘 · 轨道标记'],['candy','奶油糖果工坊','奶油面板 · 软糖按键 · 糖纸标签']]){const el=document.createElement('div');el.className='theme sample-theme';el.dataset.theme=theme;el.innerHTML='<h2>'+title+'</h2><p class="theme-desc">'+desc+'</p>'+rows;document.querySelector('#columns').append(el)}
const icons=['<path d="m3 10 9-7 9 7v10H3Z M9 20v-7h6v7"/>','<circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="11" ry="4" transform="rotate(-30 12 12)"/>','<path d="M4 4h16v13H9l-5 4Z M8 9h8 M8 13h5"/>','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4 M17 3v4 M3 11h18 M8 15h2 M14 15h2"/>','<circle cx="12" cy="8" r="4"/><path d="M4 21v-3c0-7 16-7 16 0v3"/>'];document.querySelectorAll('.sample-nav').forEach(nav=>nav.querySelectorAll('button>span').forEach((span,i)=>span.innerHTML='<svg style="width:20px;height:20px;vertical-align:middle" viewBox="0 0 24 24">'+icons[i]+'</svg>'));
</script></body></html>
